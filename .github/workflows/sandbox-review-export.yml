name: Sandbox review export latest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -qr quiz_app-simplify-core-loop-latest.zip . -x '.git/*' 'quiz_app-simplify-core-loop-latest.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-review-core-loop-latest
          path: quiz_app-simplify-core-loop-latest.zip
          compression-level: 0
          retention-days: 1
