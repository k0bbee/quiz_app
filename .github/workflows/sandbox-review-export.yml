name: Sandbox review export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source
        run: |
          zip -qr quiz_app-simplify-core-loop.zip . -x '.git/*' 'quiz_app-simplify-core-loop.zip'
          ls -lh quiz_app-simplify-core-loop.zip

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-review-core-loop
          path: quiz_app-simplify-core-loop.zip
          compression-level: 0
          retention-days: 1
