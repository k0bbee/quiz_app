name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 3 * * 1"  # weekly Monday

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt
          pip install pytest pip-audit
      - name: Check dependency integrity
        run: python -m pip check
      - name: Audit current dependency resolution
        run: python -m pip_audit -r requirements.txt
      - name: Audit release lock
        run: python -m pip_audit -r requirements-release.txt
      - name: Run tests
        run: python -m pytest -q
