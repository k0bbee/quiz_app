name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 3 * * 1"  # weekly Monday

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Qt-free test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core-test.txt
          pip install pytest pytest-timeout
      - name: Check dependency integrity
        run: python -m pip check
      - name: Run Qt-free core tests
        run: python -m pytest -m "not qt" -q --timeout=60 --timeout-method=thread

  test-and-audit:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt
          pip install pytest pip-audit pytest-timeout
      - name: Check dependency integrity
        run: python -m pip check
      - name: Audit current dependency resolution
        run: python -m pip_audit -r requirements.txt
      - name: Audit release lock
        run: python -m pip_audit -r requirements-release.txt
      - name: Run tests
        run: python -m pytest -vv --timeout=60 --timeout-method=thread
