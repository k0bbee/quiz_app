name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 3 * * 1"  # weekly Monday

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - name: Upload current main source
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-main-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt-free test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core-test.txt
          pip install pytest pytest-timeout
      - name: Check dependency integrity
        run: python -m pip check
      - name: Run Qt-free core tests
        run: python -m pytest -m "not qt" -q --timeout=60 --timeout-method=thread

  test-and-audit:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt
          pip install pytest pip-audit pytest-timeout
      - name: Check dependency integrity
        run: python -m pip check
      - name: Audit current dependency resolution
        run: python -m pip_audit -r requirements.txt
      - name: Audit release lock
        run: python -m pip_audit -r requirements-release.txt
      - name: Run tests
        run: python -m pytest -vv --timeout=60 --timeout-method=thread
