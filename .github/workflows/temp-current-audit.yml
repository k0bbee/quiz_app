name: Temporary Current Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Upload current main source
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-current-main-source
          path: .
          include-hidden-files: true
          retention-days: 1
